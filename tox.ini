[tox]
minversion = 4.4.3
envlist = py{311,312,313,314,315}{,-notebook}, lint, coverage, docs, doctest
isolated_build = True

[testenv]
package = wheel
wheel_build_env = .pkg
parallel_show_output = True
extras =
  test
  aer
  quimb-all
commands =
  pytest {posargs}

# These names are spelled out deliberately.  Writing the group as
# {,py-,py3-,py311-,...,py315-}aer-only is broken on tox 4.42.0 through 4.61.0, which
# expand numeric ranges in a section name before splitting it on braces: the
# "py311-,...,py315-" part parses as "py3" plus the range "11-15".  That defines junk
# environments (py3aer-only, 4aer-only, ...) and never defines py311-aer-only and
# friends, which then silently fall through to [testenv].  The same applies to the
# quimb-only, notebook and doctest groups below.
[testenv:{aer-only,py311-aer-only,py312-aer-only,py313-aer-only,py314-aer-only,py315-aer-only}]
extras =
  test
  aer

# Spelled out for the reason given above the aer-only environments.
[testenv:{quimb-only,py311-quimb-only,py312-quimb-only,py313-quimb-only,py314-quimb-only,py315-quimb-only}]
extras =
  test
  quimb-all

[testenv:style]
extras =
  style
commands =
  ruff check --fix qiskit_addon_aqc_tensor docs/ test/
  nbqa ruff --fix docs/
  autoflake --in-place --recursive qiskit_addon_aqc_tensor docs/ test/
  black qiskit_addon_aqc_tensor docs/ test/

[testenv:lint]
image-tester-commit = 7ae965ccf21c39e5170334ec7f4882756883860a
deps = 
  git+https://github.com/Qiskit/documentation.git@{[testenv:lint]image-tester-commit}\#egg=sphinx-alt-text-validator&subdirectory=scripts/image-tester
extras =
  lint
commands =
  ruff check qiskit_addon_aqc_tensor docs/ test/
  nbqa ruff docs/
  autoflake --check --quiet --recursive qiskit_addon_aqc_tensor docs/ test/
  black --check qiskit_addon_aqc_tensor docs/ test/
  mypy qiskit_addon_aqc_tensor --disable-error-code no-redef
  reno lint
  pylint -rn qiskit_addon_aqc_tensor test/
  sphinx-alt-text-validator -f qiskit_addon_aqc_tensor
  nbqa pylint -rn --disable=wrong-import-order,wrong-import-position docs/

# Spelled out for the reason given above the aer-only environments.
[testenv:{notebook,py311-notebook,py312-notebook,py313-notebook,py314-notebook,py315-notebook}]
extras =
  nbtest
  notebook-dependencies
commands =
  pytest --nbmake --nbmake-timeout=300 {posargs} docs/ --ignore=docs/_build

# Spelled out for the reason given above the aer-only environments.
[testenv:{doctest,py311-doctest,py312-doctest,py313-doctest,py314-doctest,py315-doctest}]
extras =
  docs
  notebook-dependencies
commands =
  sphinx-build -b doctest -T --keep-going {posargs} docs/ docs/_build/doctest

[testenv:coverage]
deps =
  coverage>=5.5
extras =
  test
  aer
  quimb-all
commands =
  coverage3 run --source qiskit_addon_aqc_tensor --parallel-mode -m pytest test/ --coverage {posargs}
  coverage3 combine
  coverage3 html
  coverage3 report --fail-under=100 --show-missing

[testenv:docs]
extras =
  docs
  notebook-dependencies
commands =
  sphinx-build -j auto -W -T --keep-going {posargs} docs/ docs/_build/html
passenv =
  CI
  GITHUB_BASE_REF
  GITHUB_REF_NAME

[testenv:docs-clean]
skip_install = true
allowlist_externals =
  rm
commands =
  rm -rf {toxinidir}/docs/stubs/ {toxinidir}/docs/_build/
